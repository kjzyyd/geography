apply plugin: 'com.android.application'

android {
    compileSdkVersion 33
    namespace 'com.example.locationclient'

    defaultConfig {
        applicationId "com.example.locationclient"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.9.0'
}
